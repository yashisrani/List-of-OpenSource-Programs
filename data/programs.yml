# Open source programs, fellowships and mentorships.
#
# Adding a program? Copy an existing entry and fill in every field. Only `name`,
# `url` and `org` are required; the rest may be omitted when genuinely unknown,
# but prefer an honest "varies" string over guessing a number.
#
# stipend:
#   min/max  integer amounts in `currency` (omit both if unpaid/unclear)
#   note     free text shown when min/max cannot express it
#   unpaid   true for programs offering no money at all
# tags: paid | unpaid | global | students | beginner-friendly | underrepresented
#
# Verify dates against the official site before editing. See the Disclaimer
# section of Readme.md.

- name: Google Summer of Code
  short_name: GSoC
  url: https://summerofcode.withgoogle.com/
  org: Google
  timeline: "Org Apps: Jan 19 - Feb 3 - Contributors: Mar 16 - Mar 31 - Coding: May 25 - Nov 2"
  timeline_year: 2026
  stipend:
    min: 1500
    max: 6600
    currency: USD
    note: 12-22 week projects
  eligibility: 18+ years, open to all
  tags: [paid, global, beginner-friendly]

- name: Outreachy
  url: https://www.outreachy.org/
  org: Software Freedom Conservancy
  timeline: Two cohorts annually (Jun-Aug / Dec-Mar). Check official site for 2026 round dates.
  stipend:
    min: 7000
    max: 7000
    currency: USD
  eligibility: Underrepresented groups in tech
  tags: [paid, global, underrepresented]

