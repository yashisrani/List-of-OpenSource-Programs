# 2026 application windows and contribution seasons.
#
# One entry per dated event. `month` drives grouping on the site and must be a
# 1-12 integer; `date` is the human label shown in the row ("Jan 7-20", "Jul").
# `program` should match a `name` or `short_name` in programs.yml/competitions.yml
# where possible, so the site can cross-link. `approx: true` renders the row as
# an estimate rather than a confirmed date.
#
# Readme.md currently contains two overlapping timeline tables. This file is the
# reconciled union of both: where they disagreed, the entry with the explicit
# UTC time or the more specific wording was kept.

