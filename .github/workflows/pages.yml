name: Deploy to GitHub Pages

# Builds the site and publishes it to GitHub Pages on every push to main.
#
# SITE_URL and SITE_BASE below target a project Pages site served from
# https://<owner>.github.io/<repo>/. They are derived from the repository name
# so a fork deploys to its own URL without editing this file.
#
# Using a custom domain instead? Set SITE_URL to that origin and SITE_BASE to
# an empty string, and add the domain in Settings > Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site-gen

      - name: Build site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}
        run: ./build.sh

      # Pages runs the output through Jekyll unless told not to, which would
      # strip any file or directory starting with an underscore.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
